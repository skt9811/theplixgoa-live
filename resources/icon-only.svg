<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sharp, high-end drop shadow for elevation on black -->
    <filter id="crispShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Deep Obsidian / Jet Black Base Canvas -->
  <rect width="512" height="512" rx="115" fill="#0A0A0A" />

  <!-- Crisp Minimal Outer Hairline Border -->
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5" />

  <!-- Center Architecture Emblem Group -->
  <g filter="url(#crispShadow)">
    <!-- Architectural Villa Roofline -->
    <path d="M 256 112 L 360 180 L 344 194 L 256 138 L 168 194 L 152 180 Z" fill="#FFFFFF" />

    <!-- Minimal Modern Villa Arch & Frond Crown -->
    <path d="M 256 146 C 266 132 278 132 284 135 C 280 144 270 150 256 150 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M 256 146 C 246 132 234 132 228 135 C 232 144 242 150 256 150 Z" fill="#FFFFFF" opacity="0.9" />
    <circle cx="256" cy="158" r="4.5" fill="#FFFFFF" />

    <!-- Structural Architrave -->
    <rect x="180" y="206" width="152" height="8" rx="2" fill="#FFFFFF" />

    <!-- Modernist Minimalist Pillars -->
    <rect x="198" y="222" width="6" height="66" rx="3" fill="#FFFFFF" opacity="0.85" />
    <rect x="308" y="222" width="6" height="66" rx="3" fill="#FFFFFF" opacity="0.85" />

    <!-- Geometric "P" Monogram -->
    <path d="M 244 226 H 268 C 281 226 290 234 290 246 C 290 258 281 266 268 266 H 254 V 288 H 244 Z M 254 235 V 257 H 267 C 274 257 280 253 280 246 C 280 239 274 235 267 235 Z" fill="#FFFFFF" />

    <!-- Foundation Plinth -->
    <rect x="166" y="296" width="180" height="8" rx="2" fill="#FFFFFF" />
  </g>

  <!-- Clean High-Contrast Brand Typography -->
  <text x="256" y="374" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', serif" font-size="52" font-weight="700" letter-spacing="14" fill="#FFFFFF">PLIX</text>

  <!-- Tracking Sub-label -->
  <text x="256" y="412" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#A3A3A3">PARTNER</text>
</svg>
